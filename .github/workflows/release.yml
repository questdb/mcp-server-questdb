name: Release MCP Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Jobs opt into write scopes only where required. Dependency install/build code
# runs exclusively in read-only jobs and passes immutable artifacts forward.
permissions:
  contents: read

# Concurrency is NOT set workflow-level: `github.ref` differs between a push
# (refs/heads/master) and the documented recovery dispatch (refs/tags/vX), so a
# ref-keyed group would let those two race the same release. The version isn't
# known until a job reads package.json, so the release-mutating jobs below each
# carry a job-level group keyed on the version instead.

jobs:
  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! printf '%s\n' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::package.json version must be canonical major.minor.patch"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: yarn install --immutable
      - run: yarn build
      - name: Verify
        run: |
          yarn lint
          yarn typecheck
          yarn test

  # This job mutates tags/releases, but never installs or executes project
  # dependencies. Draft releases are found via listReleases because GitHub's
  # get-by-tag endpoint intentionally omits drafts.
  prepare_github_release:
    name: Prepare GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    # Serialize every release-mutating job for the same version, across a push
    # and a recovery dispatch alike, so concurrent runs never race the release's
    # assets. cancel-in-progress stays false: a superseded run must finish, not
    # abort mid-upload.
    concurrency:
      group: release-${{ github.repository }}-v${{ needs.verify.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      complete: ${{ steps.prepare.outputs.complete }}
      release_id: ${{ steps.prepare.outputs.release_id }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! printf '%s\n' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::package.json version must be canonical major.minor.patch"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const crypto = require('crypto');
          const version = process.env.VERSION;
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n');
          let capturing = false;
          const result = [];
          for (const line of lines) {
            if (line.trim().startsWith('## ')) {
              if (capturing) break;
              if (line.trim() === `## ${version}` || line.trim().startsWith(`## ${version} `)) {
                capturing = true;
              }
            } else if (capturing) {
              result.push(line);
            }
          }
          const changelog = result.join('\n').trim();
          const delimiter = `EOF_${crypto.randomBytes(16).toString('hex')}`;
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `changelog<<${delimiter}\n${changelog}\n${delimiter}\n`,
          );
          SCRIPT

      # The org restricts tag creation, so the dedicated App creates the tag
      # before the draft release. Mint it only after all local source reads.
      - name: Mint release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Ensure immutable tag and draft release
        id: prepare
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const version = process.env.VERSION;
            const tag = `v${version}`;
            const bundleName = `mcp-server-questdb-${version}.mjs`;
            const expectedAssets = new Set([
              bundleName,
              'THIRD_PARTY_NOTICES.txt',
            ]);

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const matches = releases.filter((release) => release.tag_name === tag);
            if (matches.length > 1) {
              throw new Error(`Found ${matches.length} releases for ${tag}; remove duplicates before retrying`);
            }
            let release = matches[0] ?? null;

            const readTagCommit = async () => {
              let object;
              try {
                object = (
                  await github.rest.git.getRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${tag}`,
                  })
                ).data.object;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
              for (let depth = 0; object.type === 'tag' && depth < 10; depth += 1) {
                object = (
                  await github.rest.git.getTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag_sha: object.sha,
                  })
                ).data.object;
              }
              if (object.type !== 'commit') {
                throw new Error(`${tag} does not resolve to a commit`);
              }
              return object.sha;
            };

            let releaseSha = await readTagCommit();
            if (release && !releaseSha) {
              throw new Error(
                `${tag} has a release but no git tag. Create the tag at the intended source commit or remove the orphan release before retrying.`,
              );
            }

            const assetNames = new Set(release?.assets.map((asset) => asset.name) ?? []);
            const complete =
              release !== null &&
              releaseSha !== null &&
              !release.draft &&
              [...expectedAssets].every((name) => assetNames.has(name));
            if (complete) {
              core.setOutput('complete', 'true');
              core.setOutput('release_id', String(release.id));
              core.setOutput('release_sha', releaseSha);
              console.log(`${tag} is already complete at ${releaseSha}`);
              return;
            }

            if (releaseSha && releaseSha !== context.sha) {
              // The tag already exists at another commit and its release is
              // incomplete. This run is a later push (or a wrong-ref dispatch),
              // not the one that owns this version — do NOT hard-fail, or every
              // subsequent push to master stays red until a human intervenes.
              // Surface it loudly and skip the GitHub-release jobs for this run;
              // npm (already published) no-ops on its own version check. To
              // finish the incomplete release, dispatch this workflow at the tag
              // (context.sha then equals releaseSha and the repair path runs).
              core.warning(
                `Incomplete ${tag} points to ${releaseSha}, but this run is at ${context.sha}. ` +
                `Skipping the GitHub release here; dispatch this workflow at ${tag} to finish it.`,
              );
              core.setOutput('complete', 'true');
              core.setOutput('release_id', release ? String(release.id) : '');
              core.setOutput('release_sha', releaseSha);
              return;
            }
            if (!releaseSha) {
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tag}`,
                  sha: context.sha,
                });
              } catch (error) {
                // A concurrent run may have created it after our read.
                if (error.status !== 422) throw error;
              }
              releaseSha = await readTagCommit();
              if (releaseSha !== context.sha) {
                throw new Error(
                  `${tag} resolved to ${releaseSha ?? 'nothing'} after creation; expected ${context.sha}`,
                );
              }
            }

            const changelog = process.env.CHANGELOG || '_No changelog found for this release._';
            const body = [
              `## @questdb/mcp-server-questdb v${version}`,
              '',
              changelog,
              '',
              '### Standalone install (no npx / no npm access)',
              '',
              `Download \`${bundleName}\` and \`THIRD_PARTY_NOTICES.txt\` below, then:`,
              '```bash',
              `node ${bundleName} setup`,
              '```',
              '',
              `[npm](https://www.npmjs.com/package/@questdb/mcp-server-questdb/v/${version})`,
              `[npm (legacy name)](https://www.npmjs.com/package/@questdb/mcp-bridge/v/${version})`,
            ].join('\n');

            if (!release) {
              release = (
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: tag,
                  body,
                  draft: true,
                  prerelease: false,
                })
              ).data;
              console.log(`Created draft release ${tag}`);
            } else {
              // Preserve the release's current draft state — never flip a
              // published release back to a draft (which would 404 its asset
              // URLs and hide it from the releases page) just because an asset
              // is missing. github_release repairs assets in place.
              release = (
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  body,
                  draft: release.draft,
                  prerelease: false,
                })
              ).data;
              console.log(`Prepared incomplete release ${tag} for repair`);
            }

            core.setOutput('complete', 'false');
            core.setOutput('release_id', String(release.id));
            core.setOutput('release_sha', releaseSha);

  # Build dependency code without write/OIDC credentials. The tag must resolve
  # to the exact commit verified above, so provenance never covers a different
  # tree from the test gate.
  github_release_bundle:
    name: Build GitHub Release Assets
    needs: prepare_github_release
    if: needs.prepare_github_release.outputs.complete != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-v${{ needs.prepare_github_release.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare_github_release.outputs.release_sha }}
          persist-credentials: false

      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn

      - run: yarn install --immutable

      - name: Build and verify standalone bundle
        env:
          VERSION: ${{ needs.prepare_github_release.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.prepare_github_release.outputs.release_sha }}"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          yarn bundle
          test "$(node "out/mcp-server-questdb-$VERSION.mjs" --version)" = "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: github-release-${{ needs.prepare_github_release.outputs.version }}
          path: |
            out/mcp-server-questdb-${{ needs.prepare_github_release.outputs.version }}.mjs
            out/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  # Publishes the release from files produced by the read-only build job; it
  # never checks out or runs project dependency code.
  github_release:
    name: Publish GitHub Release
    needs: [prepare_github_release, github_release_bundle]
    if: >-
      always() &&
      needs.prepare_github_release.outputs.complete != 'true' &&
      needs.github_release_bundle.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release-${{ github.repository }}-v${{ needs.prepare_github_release.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-release-${{ needs.prepare_github_release.outputs.version }}
          path: out

      - name: Mint release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Upload assets and publish
        uses: actions/github-script@v8
        env:
          VERSION: ${{ needs.prepare_github_release.outputs.version }}
          RELEASE_ID: ${{ needs.prepare_github_release.outputs.release_id }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            const releaseId = Number(process.env.RELEASE_ID);
            const bundleName = `mcp-server-questdb-${version}.mjs`;
            const uploads = [
              { name: bundleName, path: `out/${bundleName}`, type: 'application/javascript' },
              { name: 'THIRD_PARTY_NOTICES.txt', path: 'out/THIRD_PARTY_NOTICES.txt', type: 'text/plain' },
            ];

            let release = (
              await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
              })
            ).data;
            // A non-draft release here is an already-published one that lost an
            // asset; repair it in place (re-upload below) rather than refusing.
            // prepare no longer flips it to a draft, so this is not reached for
            // a healthy published release (those short-circuit as complete).

            for (const upload of uploads) {
              const data = fs.readFileSync(upload.path);
              const existing = release.assets.find((asset) => asset.name === upload.name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id,
                });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: upload.name,
                data,
                headers: { 'content-type': upload.type },
              });
              console.log(`Uploaded ${upload.name}`);
            }

            release = (
              await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
              })
            ).data;
            const names = new Set(release.assets.map((asset) => asset.name));
            const missing = uploads.map((upload) => upload.name).filter((name) => !names.has(name));
            if (missing.length) throw new Error(`Release asset group is incomplete: ${missing.join(', ')}`);

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false,
              prerelease: false,
            });
            console.log(`Published complete release v${version}`);

  # Pack in a read-only job, then publish the tarballs from a credentialed job
  # that never checks out or runs project dependency code.
  # npm is bound to the same verified tag commit as the GitHub release: needs
  # prepare_github_release and checks out its release_sha, so npm can never
  # publish a version whose tag points at a different tree (or publish at all
  # when the release preparation failed).
  npm_build:
    name: Build NPM Packages
    needs: [verify, prepare_github_release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      primary_exists: ${{ steps.check.outputs.primary_exists }}
      legacy_exists: ${{ steps.check.outputs.legacy_exists }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare_github_release.outputs.release_sha }}
          persist-credentials: false

      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn

      - name: Read package version
        id: version
        env:
          RELEASE_SHA: ${{ needs.prepare_github_release.outputs.release_sha }}
          EXPECTED_VERSION: ${{ needs.prepare_github_release.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          VERSION=$(node -p "require('./package.json').version")
          if ! printf '%s\n' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::package.json version must be canonical major.minor.patch"
            exit 1
          fi
          test "$VERSION" = "$EXPECTED_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check published versions
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          check_package() {
            package="$1"
            output_name="$2"
            if output=$(npm view "$package@$VERSION" version 2>&1); then
              printf '%s\n' "$output"
              echo "$output_name=true" >> "$GITHUB_OUTPUT"
            elif printf '%s\n' "$output" | grep -q 'E404'; then
              echo "$package@$VERSION is not published"
              echo "$output_name=false" >> "$GITHUB_OUTPUT"
            else
              printf '%s\n' "$output" >&2
              exit 1
            fi
          }
          check_package "@questdb/mcp-server-questdb" primary_exists
          check_package "@questdb/mcp-bridge" legacy_exists

      - name: Install and build
        if: steps.check.outputs.primary_exists == 'false' || steps.check.outputs.legacy_exists == 'false'
        run: |
          yarn install --immutable
          yarn build

      - name: Pack primary package
        if: steps.check.outputs.primary_exists == 'false'
        run: |
          mkdir -p npm-artifacts/primary
          npm pack --ignore-scripts --pack-destination npm-artifacts/primary

      - name: Pack legacy package
        if: steps.check.outputs.legacy_exists == 'false'
        run: |
          mkdir -p npm-artifacts/legacy
          npm pkg set name=@questdb/mcp-bridge
          npm pack --ignore-scripts --pack-destination npm-artifacts/legacy

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.primary_exists == 'false' || steps.check.outputs.legacy_exists == 'false'
        with:
          name: npm-packages-${{ steps.version.outputs.version }}
          path: npm-artifacts
          if-no-files-found: error

  npm_publish:
    name: Publish to NPM
    needs: npm_build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        if: needs.npm_build.outputs.primary_exists == 'false' || needs.npm_build.outputs.legacy_exists == 'false'
        with:
          name: npm-packages-${{ needs.npm_build.outputs.version }}
          path: npm-artifacts

      - name: Publish primary package
        if: needs.npm_build.outputs.primary_exists == 'false'
        run: npm publish npm-artifacts/primary/*.tgz --provenance --access public --ignore-scripts

      - name: Publish legacy package
        if: needs.npm_build.outputs.legacy_exists == 'false'
        run: npm publish npm-artifacts/legacy/*.tgz --provenance --access public --ignore-scripts

  registry:
    name: Publish to MCP Registry
    needs: npm_publish
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/mcp-registry.yml
